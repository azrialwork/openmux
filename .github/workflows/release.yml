name: release

# Release builds run entirely in GitHub Actions.
#
# Trigger:
#   - push a tag like v0.1.0 (the openmux version — independent of
#     the upstream version it is built on), or
#   - run this workflow manually and supply a version.
#
# Each matrix job builds one target with scripts/build.sh (pinned
# upstream baseline + patches/series) and uploads the archive.
# The publish job then collects every archive, writes a combined
# SHA256SUMS, and creates the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (without the leading v)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-arm64-android
            # Cross-compiled from x64: the Android NDK's host tools are
            # x86_64 binaries, and the x64 image preinstalls the NDK.
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Set up Android build tools
        if: matrix.target == 'linux-arm64-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          # GitHub images preinstall the Android NDK; make its location
          # explicit for packages/cli/script/build.ts. GH_TOKEN lets the
          # build fetch the pinned Bun android runtime without hitting
          # the unauthenticated GitHub API rate limit.
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            ndk="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/"* 2>/dev/null | sort -V | tail -n 1)"
            test -n "$ndk"
            echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          fi
          echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Build openmux (${{ matrix.target }})
        run: scripts/build.sh "${{ matrix.target }}" build/out

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes and checksums
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          baseline="$(jq -r .baseline_tag upstream.json)"
          commit="$(jq -r .baseline_commit upstream.json)"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

          rm -f release-assets/*.sha256
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)

          {
            echo "## What this release is"
            echo
            echo "openmux v$version — OpenCode $baseline with the openmux delta applied. Built entirely in GitHub Actions; nothing was built on a local machine."
            echo
            echo "## The delta: patches in \`patches/series\` at this tag"
            echo
            applied=0
            while IFS= read -r patch_file; do
              case "$patch_file" in ''|'#'*) continue ;; esac
              applied=$((applied + 1))
              what="$(awk -F'|' -v f="\`$patch_file\`" '$2 ~ f { gsub(/^ +| +$/, "", $3); print $3; exit }' patches/README.md)"
              if [ -n "$what" ]; then
                echo "- \`$patch_file\` — $what"
              else
                echo "- \`$patch_file\`"
              fi
            done < patches/series
            if [ "$applied" -eq 0 ]; then
              echo "No patches — this release ships the upstream baseline unchanged."
            fi
            echo
            echo "Full per-patch notes, including why each patch exists: \`patches/README.md\` at this tag."
            echo
            echo "## Downloads"
            echo
            echo "Each archive contains the \`opencode\` CLI binary for one platform. Sizes and SHA-256 hashes are in the attached \`SHA256SUMS\`; verify a download with:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "## Provenance"
            echo
            echo "- Upstream: \`anomalyco/opencode\` $baseline, commit \`$commit\`"
            echo "- Delta commit: \`$GITHUB_SHA\`"
            echo "- Build run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.tag }}" \
            release-assets/*.tar.gz release-assets/SHA256SUMS \
            --title "openmux ${{ steps.prep.outputs.tag }} (on OpenCode ${{ steps.prep.outputs.baseline }})" \
            --notes-file release-notes.md
