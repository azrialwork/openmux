name: ci

# CI for the delta repository itself:
#  1. validate — upstream.json is valid, every script parses, and
#     every patch in patches/series applies cleanly onto the pinned
#     upstream baseline (via scripts/apply-patches.sh, the one apply
#     implementation everything uses).
#  2. build / build-android — the full builds, done here in GitHub
#     Actions (never on a local machine for a release): baseline +
#     patches, built with scripts/build.sh, smoke-tested, uploaded
#     as artifacts.
#
# Shared setup lives in composite actions under .github/actions/ so
# CI and the release workflow can never drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate upstream.json and scripts
        run: |
          jq -e '.upstream_url and .baseline_tag and .baseline_commit' upstream.json
          for script in scripts/*.sh scripts/lib/*.sh install.sh; do bash -n "$script"; done

      - name: Check patches apply onto the pinned baseline
        run: scripts/apply-patches.sh work/src

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-runtime

      - name: Build openmux (linux-x64)
        run: scripts/build.sh linux-x64 build/out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmux-linux-x64
          path: build/out/*
          if-no-files-found: error
          retention-days: 14

  build-android:
    needs: validate
    # Cross-compiled on the x64 image: the Android NDK's host tools
    # are x86_64 binaries, and that image preinstalls the NDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-runtime

      - uses: ./.github/actions/setup-android
        with:
          token: ${{ github.token }}

      - name: Build openmux (linux-arm64-android)
        run: scripts/build.sh linux-arm64-android build/out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmux-linux-arm64-android
          path: build/out/*
          if-no-files-found: error
          retention-days: 14
